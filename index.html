<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Step History</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./appearance.js"></script>
  </head>
  <body>
    <main class="canvas-shell">
      <header class="canvas-header">
        <p class="eyebrow">Kandev canvas</p>
        <h1>Step history</h1>
        <p class="subhead">Where this task can go, how often it's visited each step, and every recorded move.</p>
      </header>
      <section aria-live="polite" data-view>
        <p data-status>Loading step history…</p>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
